name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Générer le numéro de version (incrémenté à chaque compilation)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=${{ github.run_number }}
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "{\"version\": \"$VERSION\", \"build\": $BUILD, \"date\": \"$DATE\"}" > app/version.json
          cat app/version.json

      - name: Compiler l'application (.exe)
        run: npm run dist

      - name: Publier le résultat (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FSS-CAISSE-windows
          path: dist/*.exe
          retention-days: 5
