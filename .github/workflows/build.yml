name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Compiler l'application (.exe)
        run: npm run dist

      - name: Publier le résultat (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FSS-CAISSE-windows
          path: dist/*.exe
          retention-days: 5
