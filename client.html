<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FSS-CAISSE — Connexion</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #0e0e0e; color: #eee; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { background: #1c1c1c; padding: 36px 40px; border-radius: 12px; width: 380px; text-align: center; border: 1px solid #2a2a2a; }
  h1 { color: #CC0000; font-size: 22px; margin: 0 0 4px; }
  p { color: #999; font-size: 12px; margin: 0 0 22px; line-height: 1.5; }
  label { display:block; text-align:left; font-size: 11px; color:#888; margin-bottom: 4px; }
  input { width: 100%; padding: 11px; margin-bottom: 14px; border-radius: 6px; border: 1px solid #333; background: #0e0e0e; color: #fff; font-size: 14px; }
  input:focus { outline: none; border-color: #CC0000; }
  button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #CC0000; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; }
  button:hover { background: #a80000; }
  button.sec { background: transparent; color: #888; border: 1px solid #333; margin-top: 10px; font-weight: normal; }
  .err { color: #FF4444; font-size: 12px; margin-top: 10px; min-height: 16px; }
  .note { font-size: 11px; color: #777; text-align: left; margin: -6px 0 14px; line-height: 1.4; }
</style>
</head>
<body>
<div class="box">
  <h1>FSS-CAISSE</h1>
  <p id="sousTitre">Connexion au serveur central</p>
  <label>Adresse IP du serveur</label>
  <input id="ip" placeholder="ex: 192.168.1.24" autofocus>
  <label>Port</label>
  <input id="port" placeholder="3000" value="3000">
  <div class="note">Pour modifier ces informations plus tard, un compte admin ou super-admin sera demandé.</div>
  <input id="code" type="hidden" value="">
  <button onclick="connect()" id="btn">Se connecter</button>
  <button class="sec" id="btnAnnuler" style="display:none" onclick="window.electronAPI.annulerReglageServeur()">Annuler</button>
  <button class="sec" id="btnMode" style="display:none" onclick="if(confirm('Changer de mode (Serveur / Client) sur cet ordinateur ?')){window.electronAPI.changerDeRole();}">Changer de mode (Serveur / Client)</button>
  <div class="err" id="err"></div>
</div>
<script>
  // Première configuration : adresse + port + création d'un code technicien.
  // Modification ultérieure (?modif=1) : accessible uniquement après saisie du code technicien.
  var modif = location.search.indexOf('modif=1') !== -1;
  var creer = location.search.indexOf('creer=1') !== -1; // poste déjà configuré mais sans code : il faut en créer un
  if (modif) {
    document.getElementById('sousTitre').textContent = 'Modifier le serveur (accès technicien)';
    document.getElementById('btn').textContent = 'Enregistrer';
    document.getElementById('btnAnnuler').style.display = '';
    document.getElementById('btnMode').style.display = '';
  }
  window.electronAPI.getCurrentServer().then(function (url) {
    if (url) {
      var m = url.match(/http:\/\/([^:]+):(\d+)/);
      if (m) {
        document.getElementById('ip').value = m[1];
        document.getElementById('port').value = m[2];
      }
    }
  });

  function connect() {
    var ip = document.getElementById('ip').value.trim();
    var port = document.getElementById('port').value.trim() || '3000';
    var code = document.getElementById('code').value;
    var err = document.getElementById('err');
    if (!ip) { err.textContent = "Merci d'entrer une adresse IP"; return; }
    err.textContent = '';
    Promise.resolve(window.electronAPI.saveServer(ip, port, code)).then(function (ok) {
      if (ok === false) err.textContent = 'Enregistrement refusé';
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') connect();
  });
</script>
</body>
</html>
